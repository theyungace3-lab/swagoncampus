# Netlify build configuration.
#
# Secrets scanning: NEXT_PUBLIC_* values are compiled into the public browser
# bundle by design (supabase project URL + anon key + the admin inbox), so they
# are not secrets and must not fail the build when detected in the output.
# Every other credential (service role key, Gmail app password, OAuth secret)
# stays server-side and is never whitelisted here.
[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_SUPABASE_URL,NEXT_PUBLIC_SUPABASE_ANON_KEY,NEXT_PUBLIC_ADMIN_EMAIL"

# Static images never change without a new filename, so let browsers and the
# image CDN keep them (and any transformed variants) instead of revalidating on
# every visit — bandwidth and image-transform credits are metered on Netlify.
[[headers]]
  for = "/categories/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/auth-signin-bg.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/auth-signup-bg.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/opengraph-image.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/twitter-image.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
